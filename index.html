<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>ZB On Demand</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-scroll" id="appScroll">

  <div class="header">
    <div class="header-top">
      <h1>Newstalk<span>ZB</span></h1>
      <div class="header-badge">On Demand</div>
    </div>
    <p>Catch up on the last 7 days</p>
  </div>

  <div class="section">
    <div class="section-label">Region</div>
    <div class="region-pills" id="regionPills"></div>
  </div>

  <div class="section">
    <div class="section-label">Day</div>
    <div class="day-scroll" id="dayScroll"></div>
  </div>

  <div class="section" id="timeSection">
    <div class="section-label">Time</div>
    <div id="timeGrid"></div>
  </div>

</div>

<div class="player-bar" id="playerBar">
  <div class="player-progress-wrap" id="progressWrap">
    <div class="player-progress-track">
      <div class="player-progress-fill" id="progressFill"></div>
    </div>
  </div>
  <div class="player-times">
    <span id="timeCurrent">0:00</span>
    <span id="timeTotal">15:00</span>
  </div>
  <div class="player-content">
    <div class="player-info">
      <div class="player-title" id="playerTitle">Select a time slot</div>
      <div class="player-subtitle" id="playerSubtitle">Choose region, day &amp; time</div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="btnPrev" aria-label="Previous block">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="player-btn player-btn-play" id="btnPlay" aria-label="Play">
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <div class="spinner"></div>
      </button>
      <button class="player-btn" id="btnNext" aria-label="Next block">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="audio" preload="none"></audio>

<script src="app.js"></script>
</body>
</html>
