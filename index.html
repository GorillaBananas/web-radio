<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>ZB On Demand</title>
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>

<div class="app">

  <!-- ── Compact header: brand + region + day ── -->
  <div class="header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="#e63946"/>
        <text x="20" y="26.5" text-anchor="middle" font-family="inherit" font-size="17" font-weight="800" fill="#fff">ZB</text>
      </svg>
      <span class="brand-name">Newstalk <b>ZB</b></span>
      <span class="brand-sub">On Demand</span>
    </div>
    <div class="header-row">
      <div class="seg" id="regionSeg"></div>
      <select class="sel sel-day" id="daySel"></select>
    </div>
  </div>

  <!-- ── Hero: time selector ── -->
  <div class="time-hero">
    <label class="time-label">Select time block</label>
    <div class="time-wrap">
      <button class="time-display" id="timeDisplay" aria-haspopup="dialog">--:--</button>
    </div>
    <div class="now-sub" id="nowSub">15-minute blocks</div>
  </div>

  <!-- ── Player ── -->
  <div class="player">

    <div class="now-row">
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="now-title" id="nowTitle"></div>
    </div>

    <div class="controls">
      <button class="btn-block" id="btnPrev" aria-label="Previous block">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn-seek" id="btnBack15" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
        </svg>
        <span class="seek-label">15</span>
      </button>
      <button class="btn-play" id="btnPlay" aria-label="Play">
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <div class="spinner"></div>
      </button>
      <button class="btn-seek" id="btnFwd30" aria-label="Forward 30 seconds">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
        </svg>
        <span class="seek-label">30</span>
      </button>
      <button class="btn-block" id="btnNext" aria-label="Next block">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="skip-btns">
      <button class="btn-skip" id="btnFwd2m">+2 min</button>
      <button class="btn-skip" id="btnFwd7m">+7 min</button>
    </div>

    <div class="prog">
      <span class="prog-t" id="timeCur">0:00</span>
      <div class="prog-bar" id="progBar">
        <div class="prog-track">
          <div class="prog-fill" id="progFill"></div>
        </div>
      </div>
      <span class="prog-t" id="timeTot">0:00</span>
    </div>

  </div>

</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="timeSheet" role="dialog" aria-label="Select time block">
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle">Select time</div>
    <button class="sheet-close" id="sheetClose" aria-label="Close">&#10005;</button>
  </div>
  <div class="sheet-grid" id="sheetGrid"></div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="none" referrerpolicy="no-referrer"></audio>
<script src="app.js?v=17"></script>
</body>
</html>
